services:
  mongodb:
    image: mongo:7.0
    container_name: book-library-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: book_library
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand( { ping: 1 } )"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - book-library-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: book-library-api:latest
    container_name: book-library-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      MONGO_URI: mongodb://mongodb:27017
      DATABASE_NAME: book_library
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      - mongodb
    volumes:
      - .:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - book-library-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: book-library-frontend:latest
    container_name: book-library-frontend
    ports:
      - "8501:8501"
    environment:
      ENVIRONMENT: development
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app
    networks:
      - book-library-network

volumes:
  mongodb_data:

networks:
  book-library-network:
    driver: bridge
